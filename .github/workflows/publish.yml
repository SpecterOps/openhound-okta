name: Build and Publish

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "docker-compose/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-container.yml"

permissions:
  contents: read

concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

jobs:
  tag-release:
    permissions:
      contents: write
    # Never check out a PR head: only the reviewed commit after it has merged.
    if: >-
      github.repository == 'SpecterOps/openhound-okta' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.versioning.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Fetch tags
        run: git fetch --tags

      - name: Determine next version
        id: versioning
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          # Get latest tag or fallback
          LATEST_TAG=$(git tag --list | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "Merged branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == fix/* || "$BRANCH_NAME" == patch/* || "$BRANCH_NAME" == chore/* ]]; then
            PATCH=$((PATCH + 1))
          elif [[ "$BRANCH_NAME" == feature/* || "$BRANCH_NAME" == minor/* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "$BRANCH_NAME" == major/* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          else
            echo "Branch does not trigger release."
            exit 0
          fi

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_VERSION"

      - name: Create and push tag
        if: env.NEW_VERSION != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

  build:
    needs: tag-release
    if: needs.tag-release.outputs.new_version != ''
    permissions:
      contents: read
      id-token: write
    environment: pypi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag-release.outputs.new_version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv .venv

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  container:
    needs: [tag-release, build]
    permissions:
      contents: read
      packages: write
    if: >-
      github.repository == 'SpecterOps/openhound-okta' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/publish-container.yml
    with:
      tag: ${{ needs.tag-release.outputs.new_version }}
