name: okta
version: 0.0.3
schema_version: v2.9.0
description: "OpenHound collector for Okta using OpenHound"
authors:
  - name: Michael Grafnetter
    email: mgrafnetter@specterops.io
  - name: jdreijer
    email: jdreijer@specterops.io

type: local
license: MIT
homepage: https://github.com/specterops/openhound-okta
references:
  - name: OpenHound
    url: https://github.com/specterops/openhound

credentials:
  - name: base_url
    description: Okta base URL
    required: true
  - name: client_id
    description: Okta app registration client ID
    required: false
  - name: private_key_path
    description: Path to Okta private key
    required: false
  - name: private_key_encoded
    description: Base64 encoded Okta private key
    required: false
  - name: token
    description: Classic Okta API token
    required: false
parameters:
  - name: size
    description: An example parameter specifying batch size for fetching data
    required: false
    default: 10000
  - name: limit_app_user_collection
    description: Collect application user assignments only for a limited set of app types and listed application IDs
    required: false
    default: false
  - name: app_user_collection_app_ids
    description: Additional Okta application IDs whose user assignments are collected when the limit is enabled
    required: false
    default: []

tags: [ "okta", "extension", "opengraph", "bloodhound" ]
