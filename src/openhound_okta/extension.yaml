name: okta
version: 0.10.2
description: "OpenGraph collector for Okta"
authors:
  - name: Michael Grafnetter
    url: https://github.com/MichaelGrafnetter
  - name: Joey Dreijer
    url: https://github.com/d3vzer0
  - name: Jared Atkinson
    url: https://github.com/jaredcatkinson
  - name: Jim Sykora
    url: https://github.com/JimSycurity

type: local
license: Apache-2.0
homepage: https://github.com/specterops/openhound-okta
references:
  - name: OpenHound
    url: https://github.com/specterops/openhound

credentials:
  - name: base_url
    description: Okta base URL
    required: true
  - name: client_id
    description: Okta app registration client ID
    required: false
  - name: client_secret
    description: Okta API Service Integration client secret
    required: false
  - name: private_key_path
    description: Path to Okta private key
    required: false
  - name: private_key_b64
    description: Base64 encoded Okta private key
    required: false
  - name: token
    description: Classic Okta API token
    required: false
parameters:
  - name: applications_page_size
    description: Applications requested per applications page (1-200)
    required: false
    default: 200
  - name: application_users_page_size
    description: Users requested per application-users page (1-500)
    required: false
    default: 500
  - name: groups_page_size
    description: Groups requested per expanded groups page (1-200)
    required: false
    default: 200
  - name: application_group_assignments_page_size
    description: Groups requested per application-group-assignments page (20-200)
    required: false
    default: 200
  - name: group_push_mappings_page_size
    description: Mappings requested per group-push page (1-1000)
    required: false
    default: 1000
  - name: identity_provider_users_page_size
    description: Users requested per identity-provider-users page (1-200)
    required: false
    default: 200
  - name: endpoint_concurrency
    description: Maximum simultaneous requests for each endpoint family
    required: false
    default: 32
  - name: org_concurrency
    description: Maximum simultaneous requests across all endpoint families
    required: false
    default: 32
  - name: rate_limit_max_elapsed_seconds
    description: Maximum elapsed retry window in seconds for an individual 429 request
    required: false
    default: 900
  - name: rate_limit_remaining_reserve
    description: Requests retained as headroom in each observed rate-limit window
    required: false
    default: 1
  - name: telemetry.enabled
    description: Enable collection performance telemetry
    required: false
    default: false
  - name: telemetry.output_directory
    description: Telemetry output directory, must be outside the raw collection output tree
    required: false
    default: ./telemetry
  - name: telemetry.reporting_interval_seconds
    description: Seconds between telemetry interval records (greater than zero)
    required: false
    default: 60
  - name: telemetry.max_file_bytes
    description: Maximum size of one telemetry file in bytes (at least 65536)
    required: false
    default: 10485760
  - name: telemetry.max_interval_records
    description: Maximum interval records per telemetry file (at least 1)
    required: false
    default: 1440
  - name: telemetry.queue_capacity
    description: Telemetry record queue capacity (at least 2)
    required: false
    default: 16

tags: [ "okta", "extension", "opengraph", "bloodhound" ]
